# AURA node layout — adjust to match your physical deployment (meters)
area_size_m: 10.0
motion_threshold: 0.03
max_people: 4

# ESP32 RX node positions around disaster search area (X, Y in meters)
# Place nodes at corners of the collapsed structure perimeter
node_positions:
  1: [0.0, 0.0]      # Node 1 — southwest corner
  2: [10.0, 0.0]     # Node 2 — southeast
  3: [10.0, 10.0]    # Node 3 — northeast
  4: [0.0, 10.0]     # Node 4 — northwest

# TX probe position (informational — firmware uses broadcast)
tx_position: [5.0, -2.0]

# WiFi channel — auto-matched via AURA_HUB hotspot (TX + RX join hotspot)
wifi_channel: 0

# Live hardware CSI buffering (outdoor disaster field)
hardware:
  min_packets: 30          # ~1.5 s at 20 Hz before first detection
  window_packets: 60       # ~3 s motion window at 20 Hz
  vitals_window_packets: 120  # ~6 s for respiration / heartbeat
  refresh_every: 30
  motion_threshold_scale: 1.0   # less sensitive — fewer ghost detections
  fusion_gate_m: 2.2
  area_margin_m: 0.6
  min_node_votes: 2
  min_confidence: 0.35
  max_per_node: 2
  max_people: 4
  link_timeout_sec: 20.0
  trail_length: 80
  expected_nodes: 4
