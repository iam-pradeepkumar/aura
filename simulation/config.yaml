# AURA node layout — adjust to match your physical deployment (meters)
area_size_m: 10.0
motion_threshold: 0.02
max_people: 4

# ESP32 RX node positions around disaster search area (X, Y in meters)
node_positions:
  1: [0.0, 0.0]      # Node 1 — southwest corner
  2: [10.0, 0.0]     # Node 2 — southeast
  3: [10.0, 10.0]    # Node 3 — northeast
  4: [0.0, 10.0]     # Node 4 — northwest

tx_position: [5.0, -2.0]
wifi_channel: 0

# Live hardware — balanced: detect real walkers, suppress empty-area phantoms
hardware:
  min_packets: 12
  motion_packets: 24
  window_packets: 24
  vitals_window_packets: 48
  refresh_every: 1
  motion_threshold_scale: 0.95
  motion_score_min: 0.52        # per-node CSI motion score floor
  motion_nodes_required: 2      # 2+ nodes must see motion
  allow_motion_consensus: true  # fuse position when motion agrees but XY differs
  confirm_frames: 3             # ~0.3s sustained before showing count
  consensus_extra_frames: 1     # extra frame for motion-only consensus
  clear_frames: 2
  fusion_gate_m: 3.0            # wide gate — corners disagree on same walker
  area_margin_m: 0.35
  min_node_votes: 2
  min_confidence: 0.38
  max_per_node: 1
  max_people: 4
  allow_sector_fallback: false
  tracker_alpha: 0.75
  tracker_miss_frames: 4
  min_trail_step_m: 0.18
  link_timeout_sec: 20.0
  trail_length: 35
  expected_nodes: 4
