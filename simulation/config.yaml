# AURA node layout — adjust to match your physical deployment (meters)
area_size_m: 10.0
motion_threshold: 0.02
max_people: 8

# ESP32 RX node positions around disaster search area (X, Y in meters)
# Place nodes at corners of the collapsed structure perimeter
node_positions:
  1: [0.0, 0.0]      # Node 1 — southwest corner
  2: [10.0, 0.0]     # Node 2 — southeast
  3: [10.0, 10.0]    # Node 3 — northeast
  4: [0.0, 10.0]     # Node 4 — northwest

# TX probe position (informational — firmware uses broadcast)
tx_position: [5.0, -2.0]

# WiFi channel — auto-matched via AURA_HUB hotspot (TX + RX join hotspot)
wifi_channel: 0

# Live hardware CSI buffering (outdoor disaster field)
hardware:
  min_packets: 25          # ~1-2 s at 20 Hz (lower for field startup)
  window_packets: 80       # ~4 s window at 20 Hz
  refresh_every: 20
  motion_threshold_scale: 0.65   # more sensitive for outdoor demo
  link_timeout_sec: 20.0   # avoid flicker when CSI bursts pause
  trail_length: 80
  expected_nodes: 4
