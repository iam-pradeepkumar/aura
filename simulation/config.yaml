# AURA node layout — adjust to match your physical deployment (meters)
area_size_m: 10.0
motion_threshold: 0.02
max_people: 4

# ESP32 RX node positions around disaster search area (X, Y in meters)
node_positions:
  1: [0.0, 0.0]      # Node 1 — southwest corner
  2: [10.0, 0.0]     # Node 2 — southeast
  3: [10.0, 10.0]    # Node 3 — northeast
  4: [0.0, 10.0]     # Node 4 — northwest

tx_position: [5.0, -2.0]
wifi_channel: 0

# Live hardware — accuracy-first (empty area should read count 0)
hardware:
  min_packets: 12
  motion_packets: 24
  window_packets: 24
  vitals_window_packets: 48
  refresh_every: 1
  motion_threshold_scale: 1.05
  motion_score_min: 0.58        # ESP32 motion score floor (raise if false positives)
  motion_nodes_required: 2      # nodes that must agree on motion before alert
  fusion_gate_m: 2.2
  area_margin_m: 0.35
  min_node_votes: 2             # require 2-node agreement for a person
  min_confidence: 0.42
  max_per_node: 1
  max_people: 4
  allow_sector_fallback: false  # no phantom XY from sector estimate
  tracker_alpha: 0.72
  tracker_miss_frames: 4
  link_timeout_sec: 20.0
  trail_length: 40
  expected_nodes: 4
