# AURA node layout — adjust to match your physical deployment (meters)
# For a room test: measure corner-to-corner distance and set area_size_m + node_positions.
area_size_m: 10.0
motion_threshold: 0.015
max_people: 24

node_positions:
  1: [0.0, 0.0]
  2: [10.0, 0.0]
  3: [10.0, 10.0]
  4: [0.0, 10.0]

tx_position: [5.0, -2.0]
wifi_channel: 0

# Live hardware — tuned for indoor room sensing + outdoor field use
hardware:
  indoor_mode: true
  min_packets: 8
  motion_packets: 20
  window_packets: 20
  vitals_window_packets: 48
  refresh_every: 1
  motion_threshold_scale: 0.82
  motion_score_min: 0.38
  motion_nodes_required: 1
  calibration_frames: 18
  allow_motion_consensus: true
  confirm_frames: 2
  consensus_extra_frames: 0
  clear_frames: 2
  fusion_gate_m: 2.4
  area_margin_m: 0.12
  min_node_votes: 1
  min_confidence: 0.28
  max_per_node: 8
  max_people: 24
  allow_sector_fallback: true
  tracker_alpha: 0.82
  tracker_miss_frames: 5
  min_trail_step_m: 0.10
  link_timeout_sec: 20.0
  trail_length: 48
  expected_nodes: 4
  worker_interval_ms: 40
  display_fps: 20
