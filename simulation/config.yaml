# AURA node layout — adjust to match your physical deployment (meters)
area_size_m: 10.0
motion_threshold: 0.02
max_people: 4

node_positions:
  1: [0.0, 0.0]
  2: [10.0, 0.0]
  3: [10.0, 10.0]
  4: [0.0, 10.0]

tx_position: [5.0, -2.0]
wifi_channel: 0

# Live hardware — accuracy-tuned (calibrate empty area first ~5s)
hardware:
  min_packets: 12
  motion_packets: 28
  window_packets: 28
  vitals_window_packets: 56
  refresh_every: 1
  motion_threshold_scale: 0.92
  motion_score_min: 0.50
  motion_nodes_required: 2
  calibration_frames: 25
  allow_motion_consensus: true
  confirm_frames: 3
  consensus_extra_frames: 1
  clear_frames: 2
  fusion_gate_m: 3.2
  area_margin_m: 0.35
  min_node_votes: 2
  min_confidence: 0.36
  max_per_node: 1
  max_people: 4
  allow_sector_fallback: false
  tracker_alpha: 0.76
  tracker_miss_frames: 4
  min_trail_step_m: 0.15
  link_timeout_sec: 20.0
  trail_length: 40
  expected_nodes: 4
