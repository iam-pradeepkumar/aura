<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURA — Simulation Lab</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/css/modern.css?v=2" />
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body class="sim-modern">
  <div class="modern-shell" style="max-width:1240px;margin-top:0.75rem;">
    <nav class="modern-nav">
      <a href="/" class="modern-logo">
        <span class="logo-dots"><span class="on"></span><span></span><span></span><span></span></span>
        AURA
      </a>
      <div class="modern-nav-links">
        <a href="/">Home</a>
        <a href="/simulation">Simulation</a>
        <a href="/alerts">Alerts</a>
        <a href="/manage">DM Console</a>
        <span id="processor-badge" class="alert-pill">v—</span>
      </div>
    </nav>

    <main class="sim-main">
      <div class="sim-panel sim-upload">
        <div class="demo-banner">
          <strong>Quick demo</strong>
          <p style="font-size:0.9rem;color:var(--muted);margin:0.35rem 0 0.75rem;">No WiMANS files needed — generates synthetic CSI + video.</p>
          <button id="btn-run-demo" type="button" class="btn-primary" style="width:100%;justify-content:center;">▶ Run sample simulation</button>
        </div>
        <h2 style="margin:0 0 0.5rem;font-size:1.15rem;">Dataset upload</h2>
        <p style="color:var(--muted);font-size:0.9rem;margin-bottom:1rem;">WiMANS triple: video + .mat + .npy</p>
        <label style="font-size:0.85rem;font-weight:600;">Video .mp4</label>
        <input type="file" id="sim-video" accept="video/*,.mp4" class="sim-input" />
        <span id="sim-video-name" style="font-size:0.8rem;color:var(--muted);">—</span>
        <label style="font-size:0.85rem;font-weight:600;margin-top:0.75rem;display:block;">CSI .mat</label>
        <input type="file" id="sim-csi-mat" accept=".mat" class="sim-input" />
        <span id="sim-csi-mat-name" style="font-size:0.8rem;color:var(--muted);">—</span>
        <label style="font-size:0.85rem;font-weight:600;margin-top:0.75rem;display:block;">Amplitude .npy</label>
        <input type="file" id="sim-csi-npy" accept=".npy" class="sim-input" />
        <span id="sim-csi-npy-name" style="font-size:0.8rem;color:var(--muted);">—</span>
        <label style="font-size:0.85rem;font-weight:600;margin-top:0.75rem;display:block;">Sample rate Hz</label>
        <input type="number" id="sim-fs" placeholder="auto" class="sim-input" step="0.1" />
        <button id="btn-run-simulation" type="button" class="btn-primary" style="width:100%;margin-top:1rem;justify-content:center;">
          <span class="btn-label">Run analysis</span>
          <span class="btn-spinner hidden" id="sim-spinner" style="width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;"></span>
        </button>
        <p id="sim-status" style="margin-top:0.75rem;font-size:0.9rem;color:var(--muted);"></p>
      </div>

      <div class="sim-panel sim-video-wrap">
        <h2 style="margin:0 0 0.75rem;font-size:1.1rem;">Scene <span id="sim-time" class="alert-pill">0.00s</span></h2>
        <video id="sim-video-player" controls class="video-fit-modern"></video>
        <p id="sim-meta" style="font-size:0.85rem;color:var(--muted);margin-top:0.5rem;"></p>
      </div>

      <div class="sim-panel" style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;">
        <div class="stat-mini-modern"><span style="font-size:0.8rem;color:var(--muted)">Count</span><div id="sim-count" style="font-size:1.5rem;font-weight:800;">0</div></div>
        <div class="stat-mini-modern"><span style="font-size:0.8rem;color:var(--muted)">Motion</span><div id="sim-motion" style="font-size:1.5rem;font-weight:800;">—</div></div>
        <div class="stat-mini-modern"><span style="font-size:0.8rem;color:var(--muted)">Resp</span><div id="sim-resp" style="font-size:1.5rem;font-weight:800;">—</div></div>
        <div class="stat-mini-modern"><span style="font-size:0.8rem;color:var(--muted)">HR</span><div id="sim-hr" style="font-size:1.5rem;font-weight:800;">—</div></div>
      </div>

      <div class="sim-panel"><h3 style="margin:0 0 0.5rem;">Position map</h3><div id="sim-map" style="min-height:200px;"></div></div>
      <div class="sim-panel"><h3 style="margin:0 0 0.5rem;">Targets</h3><div id="sim-targets" style="font-size:0.9rem;"></div></div>
      <div class="sim-panel"><h3 style="margin:0 0 0.5rem;">Respiration</h3><div id="sim-resp-chart" style="min-height:160px;"></div></div>
      <div class="sim-panel"><h3 style="margin:0 0 0.5rem;">Heartbeat</h3><div id="sim-hr-chart" style="min-height:160px;"></div></div>

      <div class="sim-panel" style="grid-column:1/-1;">
        <h3 style="margin:0 0 0.5rem;">Events</h3>
        <ul id="sim-events" style="list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:0.5rem;font-size:0.9rem;"></ul>
      </div>
    </main>
  </div>
  <style>@keyframes spin{to{transform:rotate(360deg)}} .hidden{display:none!important}</style>
  <script src="/static/js/dashboard.js?v=31"></script>
</body>
</html>
