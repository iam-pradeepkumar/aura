<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURA — Mobile SAR Simulation</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/hand-drawn.css?v=5" />
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body class="sim-shell">
  <nav class="site-nav">
    <a href="/" class="site-logo">AURA ✎</a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/simulation">WiMANS Sim</a>
      <a href="/mobile" class="active">Mobile SAR</a>
      <a href="/alerts">Alerts</a>
      <a href="/manage">DM Console</a>
      <span id="processor-badge" class="badge-sketch">mobile</span>
    </div>
  </nav>

  <main class="sim-main">
    <aside class="card-sketch sim-upload">
      <h2 style="margin:0;">Mobile SAR mission</h2>
      <p style="font-size:0.9rem;opacity:0.85;">Ground rover + drone patrol a disaster zone. CSI is simulated; vitals require the rover to hold still.</p>
      <button id="btn-start-mobile" type="button" class="btn-sketch" style="width:100%;margin-top:0.75rem;">▶ Start mission</button>
      <div id="mission-status" style="margin-top:1rem;font-size:0.85rem;font-family:monospace;line-height:1.5;"></div>
    </aside>

    <section class="sim-grid">
      <div class="card-sketch sim-map-panel">
        <h3>Survivor map</h3>
        <div id="mobile-map" style="height:360px;"></div>
      </div>
      <div class="card-sketch">
        <h3>Count</h3>
        <div id="mobile-count" style="font-size:2.5rem;font-weight:bold;">0</div>
        <div id="mobile-motion" class="badge-sketch">CLEAR</div>
      </div>
      <div class="card-sketch">
        <h3>Vitals</h3>
        <div>Resp: <span id="mobile-resp">—</span> BPM</div>
        <div>Conf: <span id="mobile-resp-conf">—</span></div>
      </div>
    </section>
  </main>
  <script src="/static/js/mobile.js?v=1"></script>
</body>
</html>
